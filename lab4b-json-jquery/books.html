<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Books JSON</title>

    <style>
        body{
            font-family: Arial;
            margin: 20px;
        }

        .book{
            margin-bottom: 15px;
        }

        #error{
            color:red;
        }
    </style>
</head>

<body>

    <h1>Book Information</h1>

    <p id="firstBook"></p>

    <p id="secondAuthor"></p>

    <div id="genres"></div>

    <p id="error"></p>

<script>

fetch("books.json")

.then(response => {

    if(!response.ok){
        throw new Error("Unable to load data");
    }

    return response.json();

})

.then(data => {

    const books = data.books;

    document.getElementById("firstBook").textContent =
        "Title of first book: " + books[0].title;

    document.getElementById("secondAuthor").textContent =
        "Author of second book: " + books[1].author;

    const genresDiv =
        document.getElementById("genres");

    books.forEach(book => {

        const p = document.createElement("p");

        p.textContent =
        book.title +
        " - " +
        book.genres.join(", ");

        genresDiv.appendChild(p);

    });

})

.catch(error => {

    document.getElementById("error").textContent =
    "Error loading book data.";

});

</script>

</body>
</html>
